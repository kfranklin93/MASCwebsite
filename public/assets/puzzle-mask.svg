           Q10,20 20,20
           L80,20
           Q90,20 90,30
           L90,70
           Q90,80 80,80
           L20,80
           Q10,80 10,70
           Z"
        fill="black"/>
  <!-- Nubs for interlocking tabs -->
  <circle cx="10" cy="50" r="10" fill="white"/>
  <circle cx="90" cy="50" r="10" fill="white"/>
  <circle cx="50" cy="10" r="10" fill="white"/>
  <circle cx="50" cy="90" r="10" fill="white"/>
</svg>