name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - inital-commit-with-1000-changes  # Change this to your preferred branch (e.g., "staging")

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project (optional)
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOMMY_ANGELS_TEST }}"
          channelId: live  # Use "live" for production, or change to "staging" if needed
          projectId: mommy-angels-test  # Replace with your Firebase project ID

